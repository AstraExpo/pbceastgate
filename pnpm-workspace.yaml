packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@apollo/client": "4.2.10"
  "@apollo/client-integration-tanstack-start": "0.14.5-rc.0"
  "@graphql-typed-document-node/core": "3.2.0"
  "@apollo/client-react-streaming": "0.14.5"
  "graphql": "16.14.0"
  "rxjs": "7.8.0"
  "graphql-ws": "6.2.1"
  "zod": "4.4.3"
  "eslint": "9.39.2"
  "@eslint/js": "9.39.2"
  "@types/node": "22.19.21"
  "@types/react": "19.2.14"
  "@types/react-dom": "19.2.3"
  "tailwindcss": "4.3.1"
  "vite": "7.3.2"
  "lucide-react": "1.28.0"
  "react": "19.2.0"
  "react-dom": "19.2.0"
  "typescript-eslint": "8.59.2"
  "prettier": "3.9.0"
  "turbo": "2.10.8"
  "typescript": "6.0.3"
  "@tailwindcss/vite": "4.3.2"
  "@vitejs/plugin-react": "5.2.0"
  "@tanstack/react-form": "1.33.3"

allowBuilds:
  "@apollo/protobufjs": true
  "@firebase/util": true
  "@prisma/engines": true
  bcrypt: true
  esbuild: true
  prisma: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@rolldown/binding-linux-s390x-gnu@1.2.4"

peerDependencyRules:
  allowedVersions:
    crossws: "0.4.x"
    "@apollo/server": "5.x"

overrides:
  "@types/graphql-depth-limit>graphql": "^16.0.0"

allowedDeprecatedVersions:
  "@apollo/server-plugin-landing-page-graphql-playground": "*"
  glob: "*"
  graphql: "*"
  inflight: "*"
  node-domexception: "*"
  subscriptions-transport-ws: "*"
  recharts: "*"
  uuid: "*"
